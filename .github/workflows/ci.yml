name: Veloce Browser CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  web-build-and-test:
    name: Build & Test Web Engine (Node.js & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install App Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Execute Automated Unit Tests (node:test)
        run: npm test

      - name: Lint Codebase & Validate TypeScript Types
        run: npm run lint

      - name: Build Web Application Bundle
        run: npm run build

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veloce-web-dist
          path: dist/
          retention-days: 7

  kotlin-android-build-check:
    name: Build & Package Android APK (Kotlin & Gradle)
    runs-on: ubuntu-latest
    needs: [ web-build-and-test ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Web Bundle
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build Web Dist for Android Assets
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Setup Java JDK 17 (Java Development Kit)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace || (if [ -f gradlew ]; then chmod +x gradlew && ./gradlew assembleDebug --no-daemon; fi)

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veloce-browser-v1.0.0-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 14
