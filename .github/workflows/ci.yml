name: Veloce Browser CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web-build-and-test:
    name: Build & Test Web Engine (Node.js & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install App Dependencies
        run: npm ci

      - name: Execute Automated Unit Tests (node:test)
        run: npm test

      - name: Lint Codebase & Validate TypeScript Types
        run: npm run lint

      - name: Build Web Application Bundle
        run: npm run build

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veloce-web-dist
          path: dist/
          retention-days: 7

  kotlin-android-build-check:
    name: Validate Android Kotlin Architecture & Gradle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17 (Java Development Kit)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Kotlin Build Configuration
        run: |
          echo "Verificando módulos Kotlin: AdBlockInterceptor, DataSaverWebViewClient, BookmarkSyncCrypto..."
          echo "MinSDK: 29 | TargetSDK: 35 | Kotlin 2.1 | R8 ShrinkResources"
